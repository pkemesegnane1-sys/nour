# Netlify — publication du site statique Nour
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Les fichiers de données coraniques peuvent être mis en cache longuement
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
